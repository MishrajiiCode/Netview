name: movi
description: A Netflix-inspired movie app with Google Photos integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.4
  firebase_storage: ^12.1.3

  # Video Player
  video_player: ^2.9.1
  chewie: ^1.8.3

  # Image & Media
  cached_network_image: ^3.4.1

  # Animations & UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Audio
  audioplayers: ^6.1.0

  # State Management
  provider: ^6.1.2

  # Utilities
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  uuid: ^4.4.2
  connectivity_plus: ^6.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # package_info_plus 9.0.1 has a bug with flutter.compileSdkVersion in Gradle
  # Pinning to 8.1.2 which is stable
  package_info_plus: 8.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/lottie/

  fonts: []
